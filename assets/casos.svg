<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="640" height="290" rx="12" fill="#ffffff" stroke="#d9dde3" stroke-width="2"/>
  <text x="24" y="38" font-size="18" font-weight="700" fill="#2f5fd0">Casos de prueba y casos límite</text>

  <g font-size="13" font-weight="700" fill="#6b7280">
    <text x="24" y="68">OPERACIÓN</text><text x="230" y="68">DATOS</text><text x="400" y="68">RESULTADO</text><text x="540" y="68">ESTADO</text>
  </g>
  <line x1="20" y1="76" x2="620" y2="76" stroke="#d9dde3"/>

  <g font-size="15" fill="#1f2933">
    <text x="24" y="102">n!</text><text x="230" y="102">n = 5</text><text x="400" y="102">120</text><text x="540" y="102" fill="#1d7a46" font-weight="700">✔ Pasa</text>
    <text x="24" y="132">P(n, r)</text><text x="230" y="132">n = 5, r = 3</text><text x="400" y="132">60</text><text x="540" y="132" fill="#1d7a46" font-weight="700">✔ Pasa</text>
    <text x="24" y="162">(n−1)! circular</text><text x="230" y="162">n = 6</text><text x="400" y="162">120</text><text x="540" y="162" fill="#1d7a46" font-weight="700">✔ Pasa</text>
    <text x="24" y="192">Con repetición</text><text x="230" y="192">1,4,4,2</text><text x="400" y="192">34650</text><text x="540" y="192" fill="#1d7a46" font-weight="700">✔ Pasa</text>
    <text x="24" y="222">P(n, r)</text><text x="230" y="222">n = 3, r = 5</text><text x="400" y="222">ERROR</text><text x="540" y="222" fill="#1d7a46" font-weight="700">✔ Pasa</text>
  </g>
  <line x1="20" y1="236" x2="620" y2="236" stroke="#d9dde3"/>
  <text x="24" y="262" font-size="13" fill="#6b7280">Casos límite: 0! = 1 · P(n, 0) = 1 · P(n, n) = n! · PC(1) = 1 · r &gt; n → ERROR · n &gt; 1000 → ERROR</text>
</svg>
