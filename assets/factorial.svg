<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" font-family="Georgia, 'Times New Roman', serif">
  <rect width="640" height="230" rx="12" fill="#f0f3fa" stroke="#2f5fd0" stroke-width="2"/>
  <text x="24" y="38" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#2f5fd0">1. Permutación de n elementos</text>
  <text x="320" y="95" text-anchor="middle" font-size="40" font-style="italic" fill="#1f2933">P<tspan font-size="24" dy="8">n</tspan><tspan dy="-8"> = n!</tspan></text>
  <text x="24" y="135" font-family="system-ui, sans-serif" font-size="15" fill="#6b7280">Ejemplo: ordenar 3 letras A, B, C  (n = 3)</text>
  <g font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">
    <g transform="translate(40,150)">
      <rect width="80" height="28" rx="6" fill="#2f5fd0"/><text x="40" y="20">ABC</text>
      <rect x="95" width="80" height="28" rx="6" fill="#2f5fd0"/><text x="135" y="20">ACB</text>
      <rect x="190" width="80" height="28" rx="6" fill="#2f5fd0"/><text x="230" y="20">BAC</text>
      <rect x="285" width="80" height="28" rx="6" fill="#2f5fd0"/><text x="325" y="20">BCA</text>
      <rect x="380" width="80" height="28" rx="6" fill="#2f5fd0"/><text x="420" y="20">CAB</text>
      <rect x="475" width="80" height="28" rx="6" fill="#2f5fd0"/><text x="515" y="20">CBA</text>
    </g>
  </g>
  <text x="320" y="210" text-anchor="middle" font-size="22" fill="#1d7a46" font-weight="700">3! = 3 · 2 · 1 = 6</text>
</svg>
