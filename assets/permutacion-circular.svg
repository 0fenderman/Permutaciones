<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Georgia, 'Times New Roman', serif">
  <rect width="640" height="300" rx="12" fill="#f0f3fa" stroke="#2f5fd0" stroke-width="2"/>
  <text x="24" y="38" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#2f5fd0">3. Permutación circular (animada)</text>

  <text x="170" y="95" text-anchor="middle" font-size="36" font-style="italic" fill="#1f2933">PC(n) = (n − 1)!</text>
  <text x="24" y="135" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">Girar la mesa no crea una</text>
  <text x="24" y="155" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">disposición nueva: se fija 1 elemento</text>
  <text x="24" y="175" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">y se ordenan los demás.</text>
  <text x="24" y="215" font-family="system-ui, sans-serif" font-size="15" fill="#1f2933">Ejemplo: 4 personas en una mesa</text>
  <text x="24" y="245" font-size="22" fill="#1d7a46" font-weight="700">PC(4) = 3! = 6</text>

  <!-- mesa -->
  <g transform="translate(470,165)">
    <circle r="60" fill="#fff" stroke="#9aa5b8" stroke-width="2" stroke-dasharray="4 4"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <g font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">
        <circle cx="0" cy="-60" r="19" fill="#2f5fd0"/><text x="0" y="-54">A</text>
        <circle cx="60" cy="0" r="19" fill="#1d7a46"/><text x="60" y="6">B</text>
        <circle cx="0" cy="60" r="19" fill="#b3261e"/><text x="0" y="66">C</text>
        <circle cx="-60" cy="0" r="19" fill="#d99a00"/><text x="-60" y="6">D</text>
      </g>
    </g>
  </g>
  <text x="470" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">A-B-C-D es siempre el mismo orden</text>
</svg>
