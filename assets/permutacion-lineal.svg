<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" font-family="Georgia, 'Times New Roman', serif">
  <rect width="640" height="260" rx="12" fill="#f0f3fa" stroke="#2f5fd0" stroke-width="2"/>
  <text x="24" y="38" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#2f5fd0">2. Permutación lineal sin repetición</text>

  <text x="200" y="100" text-anchor="middle" font-size="34" font-style="italic" fill="#1f2933">P(n, r) =</text>
  <!-- fracción -->
  <text x="370" y="84" text-anchor="middle" font-size="34" font-style="italic" fill="#1f2933">n!</text>
  <line x1="320" y1="95" x2="420" y2="95" stroke="#1f2933" stroke-width="2.5"/>
  <text x="370" y="128" text-anchor="middle" font-size="34" font-style="italic" fill="#1f2933">(n − r)!</text>

  <text x="24" y="168" font-family="system-ui, sans-serif" font-size="15" fill="#6b7280">Ejemplo: elegir y ordenar 3 de 5 elementos  (n = 5, r = 3)</text>
  <g font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="40" y="182" width="70" height="30" rx="6" fill="#2f5fd0"/><text x="75" y="203">5 op.</text>
    <text x="130" y="203" fill="#1f2933" font-size="20">×</text>
    <rect x="150" y="182" width="70" height="30" rx="6" fill="#2f5fd0"/><text x="185" y="203">4 op.</text>
    <text x="240" y="203" fill="#1f2933" font-size="20">×</text>
    <rect x="260" y="182" width="70" height="30" rx="6" fill="#2f5fd0"/><text x="295" y="203">3 op.</text>
  </g>
  <text x="350" y="203" font-size="20" fill="#1f2933">=  <tspan font-style="italic">5!/2!</tspan> = 120/2</text>
  <text x="320" y="245" text-anchor="middle" font-size="22" fill="#1d7a46" font-weight="700">P(5, 3) = 60</text>
</svg>
