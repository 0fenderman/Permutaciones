<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="Georgia, 'Times New Roman', serif">
  <rect width="640" height="280" rx="12" fill="#f0f3fa" stroke="#2f5fd0" stroke-width="2"/>
  <text x="24" y="38" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#2f5fd0">4. Permutación con repetición</text>

  <text x="150" y="105" text-anchor="middle" font-size="34" font-style="italic" fill="#1f2933">P =</text>
  <text x="330" y="86" text-anchor="middle" font-size="32" font-style="italic" fill="#1f2933">n!</text>
  <line x1="215" y1="98" x2="445" y2="98" stroke="#1f2933" stroke-width="2.5"/>
  <text x="330" y="132" text-anchor="middle" font-size="32" font-style="italic" fill="#1f2933">n₁! · n₂! ··· n<tspan font-size="20" dy="6">k</tspan><tspan dy="-6">!</tspan></text>

  <text x="24" y="170" font-family="system-ui, sans-serif" font-size="15" fill="#6b7280">Ejemplo: letras de MISSISSIPPI  (n = 11)</text>
  <g font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">
    <rect x="40" y="184" width="90" height="28" rx="6" fill="#2f5fd0"/><text x="85" y="204">M × 1</text>
    <rect x="145" y="184" width="90" height="28" rx="6" fill="#1d7a46"/><text x="190" y="204">I × 4</text>
    <rect x="250" y="184" width="90" height="28" rx="6" fill="#b3261e"/><text x="295" y="204">S × 4</text>
    <rect x="355" y="184" width="90" height="28" rx="6" fill="#d99a00"/><text x="400" y="204">P × 2</text>
  </g>
  <text x="470" y="205" font-size="20" fill="#1f2933"><tspan font-style="italic">1 + 4 + 4 + 2 = 11</tspan></text>

  <text x="320" y="248" text-anchor="middle" font-size="22" fill="#1d7a46" font-weight="700">11! / (1! · 4! · 4! · 2!) = 39 916 800 / 1 152 = 34 650</text>
</svg>
